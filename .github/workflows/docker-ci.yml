name: Docker build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - app/**
      - build/**
      - worker/**
      - vite.config.ts
      - .github/workflows/docker-ci.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag tongpin-team-workspace:ci .
